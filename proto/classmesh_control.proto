syntax = "proto3";

package classmesh.control.v1;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_SERVICE_SESSION_WORKER = 1;
  CAPABILITY_DXGI_CAPTURE = 2;
  CAPABILITY_WINDOWS_GRAPHICS_CAPTURE = 3;
  CAPABILITY_H264_HARDWARE_ENCODE = 4;
  CAPABILITY_H264_HARDWARE_DECODE = 5;
  CAPABILITY_UDP_MULTICAST = 6;
  CAPABILITY_UDP_UNICAST = 7;
  CAPABILITY_QUIC_DATAGRAM = 8;
  CAPABILITY_WEBRTC = 9;
  CAPABILITY_LOCAL_SFU = 10;
}

enum PrincipalRole {
  PRINCIPAL_ROLE_UNSPECIFIED = 0;
  PRINCIPAL_ROLE_TEACHER = 1;
  PRINCIPAL_ROLE_STUDENT_DEVICE = 2;
  PRINCIPAL_ROLE_ADMINISTRATOR = 3;
}

message Hello {
  ProtocolVersion version = 1;
  bytes device_id = 2;
  string hostname = 3;
  repeated Capability capabilities = 4;
  string app_version = 5;
  PrincipalRole role = 6;

  // SHA-256 fingerprint of the presented enrollment credential. The stable
  // device_id is deliberately independent from this value so credentials can
  // rotate without changing device identity.
  bytes credential_fingerprint_sha256 = 7;
}

enum ControlRejectReason {
  CONTROL_REJECT_REASON_UNSPECIFIED = 0;
  CONTROL_REJECT_REASON_INCOMPATIBLE_PROTOCOL = 1;
  CONTROL_REJECT_REASON_UNAUTHORIZED = 2;
  CONTROL_REJECT_REASON_REVOKED = 3;
  CONTROL_REJECT_REASON_INVALID_IDENTITY = 4;
}

message HelloAck {
  bool accepted = 1;
  ProtocolVersion negotiated_version = 2;
  uint64 control_session_id = 3;
  repeated Capability negotiated_capabilities = 4;
  ControlRejectReason reject_reason = 5;
  string diagnostic = 6;
}

message Heartbeat {
  // Sender-local monotonic time for diagnostics only. It must never be
  // compared directly with the peer's monotonic clock.
  uint64 monotonic_time_us = 1;
  uint64 control_session_id = 2;
  MediaHealth media = 3;
}

message HeartbeatAck {
  // Echoes the ControlEnvelope.sequence that carried the Heartbeat.
  uint64 heartbeat_sequence = 1;
  uint64 monotonic_time_us = 2;
}

enum MediaHealth {
  MEDIA_HEALTH_UNSPECIFIED = 0;
  MEDIA_HEALTH_IDLE = 1;
  MEDIA_HEALTH_STARTING = 2;
  MEDIA_HEALTH_STREAMING = 3;
  MEDIA_HEALTH_DEGRADED = 4;
  MEDIA_HEALTH_RECOVERING = 5;
  MEDIA_HEALTH_SUSPENDED = 6;
  MEDIA_HEALTH_FAILED = 7;
}

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_MONITORING = 1;
  STREAM_KIND_INTERACTIVE = 2;
  STREAM_KIND_TEACHER_PRESENTATION = 3;
}

enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;
  VIDEO_CODEC_HEVC = 2;
  VIDEO_CODEC_AV1 = 3;
}

enum MediaTransport {
  MEDIA_TRANSPORT_UNSPECIFIED = 0;
  MEDIA_TRANSPORT_UDP_MULTICAST = 1;
  MEDIA_TRANSPORT_UDP_UNICAST = 2;
  MEDIA_TRANSPORT_QUIC_DATAGRAM = 3;
  MEDIA_TRANSPORT_WEBRTC = 4;
  MEDIA_TRANSPORT_RELIABLE_FALLBACK = 5;
}

message VideoProfile {
  uint32 width = 1;
  uint32 height = 2;
  uint32 fps = 3;
  uint32 bitrate_kbps = 4;
  VideoCodec codec = 5;
}

message StreamOffer {
  uint64 stream_id = 1;
  StreamKind kind = 2;
  MediaTransport transport = 3;
  VideoProfile profile = 4;
  bytes transport_parameters = 5;
}

message StreamAnswer {
  uint64 stream_id = 1;
  bool accepted = 2;
  string rejection_reason = 3;
  repeated MediaTransport supported_transports = 4;
}

message ReceiverFeedback {
  uint64 stream_id = 1;
  float rtt_ms = 2;
  float packet_loss = 3;
  float jitter_ms = 4;
  float decode_fps = 5;
  float decode_latency_ms = 6;
  float render_latency_ms = 7;
  float queue_delay_ms = 8;
  uint64 dropped_frames = 9;
  uint64 reordered_packets = 10;
  uint64 received_bitrate_bps = 11;
}

message Nack {
  uint64 stream_id = 1;
  uint64 frame_id = 2;
  repeated uint32 missing_packet_indices = 3;
  uint64 recovery_deadline_us = 4;
}

message KeyframeRequest {
  uint64 stream_id = 1;
  uint64 last_decodable_frame_id = 2;
}

message StreamReconfigure {
  uint64 stream_id = 1;
  VideoProfile profile = 2;
  MediaTransport transport = 3;
  bytes transport_parameters = 4;
}

message MouseMove {
  sint32 x = 1;
  sint32 y = 2;
  bool absolute = 3;
}

message MouseButton {
  uint32 button = 1;
  bool down = 2;
}

message MouseWheel {
  sint32 delta = 1;
  bool horizontal = 2;
}

message KeyEvent {
  uint32 virtual_key = 1;
  uint32 scan_code = 2;
  bool down = 3;
  bool extended = 4;
}

message ReleaseAllInput {}

message InputEvent {
  uint64 sequence = 1;
  uint64 timestamp_us = 2;
  oneof event {
    MouseMove mouse_move = 10;
    MouseButton mouse_button = 11;
    MouseWheel mouse_wheel = 12;
    KeyEvent key = 13;
    ReleaseAllInput release_all = 14;
  }
}

message SessionWorkerStatus {
  uint32 windows_session_id = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    STOPPED = 1;
    STARTING = 2;
    RUNNING = 3;
    SUSPENDED = 4;
    RECOVERING = 5;
  }
  State state = 2;
  string diagnostic = 3;
}

// Every reliable control-plane message is carried inside this envelope.
// sequence is monotonically increasing within a control session and supports
// duplicate/replay suppression at the application layer. request_id is zero
// for uncorrelated events and non-zero for request/response flows.
message ControlEnvelope {
  uint64 control_session_id = 1;
  uint64 sequence = 2;
  ProtocolVersion protocol_version = 3;
  uint64 request_id = 4;

  oneof payload {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    Heartbeat heartbeat = 12;
    HeartbeatAck heartbeat_ack = 13;

    StreamOffer stream_offer = 20;
    StreamAnswer stream_answer = 21;
    ReceiverFeedback receiver_feedback = 22;
    Nack nack = 23;
    KeyframeRequest keyframe_request = 24;
    StreamReconfigure stream_reconfigure = 25;

    InputEvent input_event = 30;
    SessionWorkerStatus session_worker_status = 31;
  }
}
