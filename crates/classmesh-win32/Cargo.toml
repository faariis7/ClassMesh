[package]
name = "classmesh-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "classmesh-trusted-provision"
path = "src/bin/trusted_provision.rs"
required-features = ["experimental-trusted-policy"]

[features]
default = []
experimental-trusted-policy = ["dep:classmesh-security", "dep:classmesh-identity-win", "dep:serde", "dep:serde_json", "dep:sha2", "dep:rustls"]

[dependencies]
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
classmesh-security = { path = "../classmesh-security", optional = true }
classmesh-identity-win = { path = "../classmesh-identity-win", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
classmesh-identity-win = { path = "../classmesh-identity-win" }
classmesh-security = { path = "../classmesh-security" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rcgen = { version = "0.14", default-features = false }

[lints]
workspace = true
