[package]
name = "classmesh-teacher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
classmesh-control = { path = "../../crates/classmesh-control" }
classmesh-core = { path = "../../crates/classmesh-core" }
classmesh-protocol = { path = "../../crates/classmesh-protocol" }
classmesh-security = { path = "../../crates/classmesh-security" }
classmesh-video = { path = "../../crates/classmesh-video" }
classmesh-windows-runtime = { path = "../../crates/classmesh-windows-runtime" }

[target.'cfg(windows)'.dependencies]
classmesh-capture-win = { path = "../../crates/classmesh-capture-win" }
classmesh-worker = { path = "../classmesh-worker" }
eframe = { version = "=0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }

[dev-dependencies]
quinn = "0.11.12"
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
