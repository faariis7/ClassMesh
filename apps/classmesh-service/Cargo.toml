[package]
name = "classmesh-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
classmesh-windows-runtime = { path = "../../crates/classmesh-windows-runtime" }

[target.'cfg(windows)'.dependencies]
classmesh-codec-win = { path = "../../crates/classmesh-codec-win" }
classmesh-control = { path = "../../crates/classmesh-control" }
classmesh-core = { path = "../../crates/classmesh-core" }
classmesh-identity-win = { path = "../../crates/classmesh-identity-win" }
classmesh-protocol = { path = "../../crates/classmesh-protocol" }
classmesh-security = { path = "../../crates/classmesh-security" }
classmesh-win32 = { path = "../../crates/classmesh-win32" }
quinn = "0.11.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
windows-service = "0.8.1"

[lints]
workspace = true
