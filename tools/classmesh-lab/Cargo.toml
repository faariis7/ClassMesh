[package]
name = "classmesh-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1"
getrandom = "0.3"
classmesh-core = { path = "../../crates/classmesh-core" }
classmesh-network = { path = "../../crates/classmesh-network" }
classmesh-protocol = { path = "../../crates/classmesh-protocol" }
classmesh-video = { path = "../../crates/classmesh-video" }
prost = "0.14.4"
quinn = "0.11.12"
rcgen = "0.14"
rustls = "0.23"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
classmesh-control = { path = "../../crates/classmesh-control" }
classmesh-identity-win = { path = "../../crates/classmesh-identity-win" }
classmesh-security = { path = "../../crates/classmesh-security" }

[lints]
workspace = true
