[package]
name = "classmesh-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = "1"
getrandom = "0.3"
classmesh-core = { path = "../../crates/classmesh-core" }
classmesh-network = { path = "../../crates/classmesh-network" }
classmesh-protocol = { path = "../../crates/classmesh-protocol" }
classmesh-video = { path = "../../crates/classmesh-video" }
prost = "0.14.4"
quinn = "0.11.12"
rcgen = "0.14"
rustls = "0.23"
sha2 = "0.10"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
x509-parser = "0.18"
classmesh-control = { path = "../../crates/classmesh-control" }
classmesh-identity-win = { path = "../../crates/classmesh-identity-win" }
classmesh-security = { path = "../../crates/classmesh-security" }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
classmesh-codec-win = { path = "../../crates/classmesh-codec-win" }
classmesh-render-win = { path = "../../crates/classmesh-render-win" }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DXCore",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
classmesh-security = { path = "../../crates/classmesh-security" }
classmesh-windows-runtime = { path = "../../crates/classmesh-windows-runtime" }
classmesh-worker = { path = "../../apps/classmesh-worker" }

[target.'cfg(windows)'.dev-dependencies]
# Exercise the same read-only protected identity preflight used by the installer
# against a real disposable CNG StudentDevice enrollment, not a mock bundle.
classmesh-win32 = { path = "../../crates/classmesh-win32", features = ["experimental-trusted-policy"] }

[lints]
workspace = true
