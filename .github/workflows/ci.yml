name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable Rust
    runs-on: [self-hosted, linux, x64, synology]
    env:
      CARGO_TARGET_DIR: /opt/github-cache/target/classmesh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Synthetic media lab
        run: cargo run -p classmesh-lab --bin classmesh-lab

      - name: Synthetic Wi-Fi direct fanout baseline
        run: cargo run -p classmesh-lab --bin classmesh-wifi-fanout-benchmark -- --strategy direct-unicast --receivers 5 --frames 120

      - name: Synthetic Wi-Fi relay fanout baseline
        run: cargo run -p classmesh-lab --bin classmesh-wifi-fanout-benchmark -- --strategy relay --receivers 5 --frames 120

      - name: Synthetic monitoring grid baseline
        run: cargo run -p classmesh-lab --bin classmesh-monitoring-grid-benchmark -- --sources 30 --rounds 30

      - name: Synthetic adaptive controller baseline
        run: cargo run -p classmesh-lab --bin classmesh-adaptive-controller-benchmark -- --receivers 30 --rounds 30

  windows:
    name: Windows Build
    # Public fork PRs must not execute on the persistent local VM.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, parallels, classmesh]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: C:\ClassMeshCI\target
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Phase 4 PowerShell runner
        shell: pwsh
        run: .\scripts\phase4-two-pc.ps1 -Mode Help

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build media diagnostics
        run: cargo build -p classmesh-worker --bin classmesh-media-probe --bin classmesh-media-receiver --bin classmesh-media-recovery-probe --release

      - name: Build network impairment proxy
        run: cargo build -p classmesh-lab --bin classmesh-network-impairment-proxy --release

      - name: Build transport benchmark
        run: cargo build -p classmesh-lab --bin classmesh-transport-benchmark --release

      - name: Build Wi-Fi fanout benchmark
        run: cargo build -p classmesh-lab --bin classmesh-wifi-fanout-benchmark --release

      - name: Build monitoring grid benchmark
        run: cargo build -p classmesh-lab --bin classmesh-monitoring-grid-benchmark --release

      - name: Build adaptive controller benchmark
        run: cargo build -p classmesh-lab --bin classmesh-adaptive-controller-benchmark --release

      - name: Build Phase 12B4 Service qualification binary
        run: cargo build -p classmesh-service --release

      - name: Build Teacher UI shell
        run: cargo build -p classmesh-teacher --bin classmesh-teacher-ui --release

      - name: Validate Teacher UI workspace MSRV
        shell: pwsh
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 check -p classmesh-teacher --bin classmesh-teacher-ui

      - name: Validate Phase 11F4 Teacher UI smoke helper
        shell: pwsh
        run: .\scripts\phase11f4-teacher-ui-smoke.ps1 -Mode Help

      - name: Validate Phase 12B4 system-action qualification helper
        shell: pwsh
        run: .\scripts\phase12b4-system-actions.ps1 -Mode Help

      - name: Build Phase 7 multicast probe
        run: cargo build -p classmesh-lab --bin classmesh-multicast-probe --release

      - name: Build Phase 6F interactive qualification client
        run: cargo build -p classmesh-lab --bin classmesh-interactive-qualification --release

      - name: Build protected Teacher enrollment request tool
        run: cargo build -p classmesh-lab --bin classmesh-enrollment-request --release

      - name: Build approved Teacher enrollment installer
        run: cargo build -p classmesh-lab --bin classmesh-enrollment-install --release

      - name: Build offline Teacher enrollment authority
        run: cargo build -p classmesh-lab --bin classmesh-enrollment-authority --release

      - name: Build Student Teacher authorization tool
        run: cargo build -p classmesh-lab --bin classmesh-student-authorize-teacher --release

      - name: Validate Phase 6F tool help
        shell: pwsh
        run: |
          .\target\release\classmesh-interactive-qualification.exe --help
          .\target\release\classmesh-enrollment-request.exe --help
          .\target\release\classmesh-enrollment-install.exe --help
          .\target\release\classmesh-enrollment-authority.exe --help
          .\target\release\classmesh-student-authorize-teacher.exe --help

      - name: Validate Phase 6F physical runner help
        shell: pwsh
        run: .\scripts\phase6f-two-pc.ps1 -Mode Help

      - name: Validate Phase 7 multicast probe help
        shell: pwsh
        run: .\target\release\classmesh-multicast-probe.exe --help

      - name: Validate Phase 8 synthetic fanout baseline
        shell: pwsh
        run: |
          .\target\release\classmesh-wifi-fanout-benchmark.exe --help
          .\target\release\classmesh-wifi-fanout-benchmark.exe --strategy direct-unicast --receivers 5 --frames 120
          .\target\release\classmesh-wifi-fanout-benchmark.exe --strategy relay --receivers 5 --frames 120

      - name: Validate Phase 9 synthetic monitoring baseline
        shell: pwsh
        run: |
          .\target\release\classmesh-monitoring-grid-benchmark.exe --help
          $output = .\target\release\classmesh-monitoring-grid-benchmark.exe --sources 30 --rounds 30
          $output | Write-Host
          if ($output -notcontains "physical_classroom=false") {
            throw "Phase 9 synthetic baseline must not claim physical classroom evidence"
          }
          if ($output -notcontains "physical_qualification=false") {
            throw "Phase 9 synthetic baseline must not claim physical qualification"
          }
          if ($output -notcontains "synthetic_invariants_passed=true") {
            throw "Phase 9 synthetic baseline did not pass its bounded invariants"
          }

      - name: Validate Phase 10 synthetic adaptive baseline
        shell: pwsh
        run: |
          .\target\release\classmesh-adaptive-controller-benchmark.exe --help
          $output = .\target\release\classmesh-adaptive-controller-benchmark.exe --receivers 30 --rounds 30
          $output | Write-Host
          if ($output -notcontains "physical_qualification=false") {
            throw "Phase 10 synthetic baseline must not claim physical qualification"
          }
          if ($output -notcontains "production_default_selected=false") {
            throw "Phase 10 synthetic baseline must not select a production default"
          }
          if ($output -notcontains "synthetic_invariants_passed=true") {
            throw "Phase 10 synthetic baseline did not pass its adaptive invariants"
          }

      - name: Validate Phase 7H physical runner
        shell: pwsh
        run: |
          .\scripts\phase7h-scale.ps1 -Mode Help
          $results = Join-Path $env:RUNNER_TEMP "phase7h-selftest"
          .\scripts\phase7h-scale.ps1 -Mode Init -ReceiverCount 2 -ReceiverId student-01,student-02 -ResultsDir $results
          $receiverDir = Join-Path $results "receivers"
          Set-Content -LiteralPath (Join-Path $results "teacher.log") -Value "synthetic-ci-teacher-evidence"
          Set-Content -LiteralPath (Join-Path $receiverDir "student-01.log") -Value "synthetic-ci-evidence"
          Set-Content -LiteralPath (Join-Path $receiverDir "student-02.log") -Value "synthetic-ci-evidence"
          .\scripts\phase7h-scale.ps1 -Mode ValidateEvidence -ResultsDir $results
          if (-not (Test-Path -LiteralPath (Join-Path $results "evidence-index.json"))) {
            throw "Phase 7H evidence index was not created"
          }

      - name: Validate Phase 8D physical Wi-Fi runner
        shell: pwsh
        run: |
          .\scripts\phase8d-wifi.ps1 -Mode Help
          $results = Join-Path $env:RUNNER_TEMP "phase8d-selftest"
          $ids = @("student-01","student-02","student-03","student-04","student-05")
          .\scripts\phase8d-wifi.ps1 -Mode Init -Strategy direct-unicast -ReceiverCount 5 -ReceiverId $ids -ResultsDir $results
          $receiverDir = Join-Path $results "receivers"
          Set-Content -LiteralPath (Join-Path $results "teacher.log") -Value "synthetic-ci-teacher-evidence"
          Set-Content -LiteralPath (Join-Path $results "ap.log") -Value "synthetic-ci-ap-evidence"
          foreach ($id in $ids) {
            Set-Content -LiteralPath (Join-Path $receiverDir "$id.log") -Value "synthetic-ci-receiver-evidence"
          }
          .\scripts\phase8d-wifi.ps1 -Mode ValidateEvidence -ResultsDir $results
          $indexPath = Join-Path $results "evidence-index.json"
          if (-not (Test-Path -LiteralPath $indexPath)) {
            throw "Phase 8D evidence index was not created"
          }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($null -ne $index.strategy_selected) {
            throw "Phase 8D self-test must not select a strategy"
          }
          if ($null -eq $index.ap -or [string]::IsNullOrWhiteSpace([string]$index.ap.sha256)) {
            throw "Phase 8D self-test did not index AP evidence"
          }

      - name: Validate Phase 9F monitoring runner
        shell: pwsh
        run: |
          .\scripts\phase9f-monitoring.ps1 -Mode Help
          $results = Join-Path $env:RUNNER_TEMP "phase9f-selftest"
          $ids = @("student-01","student-02","student-03","student-04","student-05")
          .\scripts\phase9f-monitoring.ps1 -Mode Init -ReceiverCount 5 -ReceiverId $ids -ResultsDir $results
          $receiverDir = Join-Path $results "receivers"
          Set-Content -LiteralPath (Join-Path $results "teacher.log") -Value "synthetic-ci-teacher-monitoring-evidence"
          Set-Content -LiteralPath (Join-Path $results "network.log") -Value "synthetic-ci-network-evidence"
          Set-Content -LiteralPath (Join-Path $results "teacher-ui.log") -Value "synthetic-ci-ui-evidence"
          foreach ($id in $ids) {
            Set-Content -LiteralPath (Join-Path $receiverDir "$id.log") -Value "synthetic-ci-receiver-monitoring-evidence"
          }
          .\scripts\phase9f-monitoring.ps1 -Mode ValidateEvidence -ResultsDir $results
          $indexPath = Join-Path $results "evidence-index.json"
          if (-not (Test-Path -LiteralPath $indexPath)) {
            throw "Phase 9F evidence index was not created"
          }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($null -ne $index.qualification_passed) {
            throw "Phase 9F self-test must not claim physical qualification"
          }
          if ($index.receiver_count -ne 5 -or $index.tile_width -ne 320 -or $index.tile_height -ne 180 -or $index.fps -ne 3) {
            throw "Phase 9F evidence index does not preserve the expected monitoring contract"
          }
          if ($null -eq $index.network -or [string]::IsNullOrWhiteSpace([string]$index.network.sha256)) {
            throw "Phase 9F self-test did not index optional network evidence"
          }
          if ($null -eq $index.teacher_ui -or [string]::IsNullOrWhiteSpace([string]$index.teacher_ui.sha256)) {
            throw "Phase 9F self-test did not index optional UI evidence"
          }

      - name: Validate Phase 10G adaptive runner
        shell: pwsh
        run: |
          .\scripts\phase10g-adaptive.ps1 -Mode Help
          $results = Join-Path $env:RUNNER_TEMP "phase10g-selftest"
          $ids = @("student-01","student-02","student-03","student-04","student-05")
          .\scripts\phase10g-adaptive.ps1 -Mode Init -ReceiverCount 5 -ReceiverId $ids -ResultsDir $results
          $receiverDir = Join-Path $results "receivers"
          Set-Content -LiteralPath (Join-Path $results "teacher.log") -Value "synthetic-ci-teacher-adaptive-evidence"
          Set-Content -LiteralPath (Join-Path $results "network.log") -Value "synthetic-ci-network-evidence"
          Set-Content -LiteralPath (Join-Path $results "topology.log") -Value "synthetic-ci-topology-evidence"
          Set-Content -LiteralPath (Join-Path $results "recovery.log") -Value "synthetic-ci-recovery-evidence"
          Set-Content -LiteralPath (Join-Path $results "encoder.log") -Value "synthetic-ci-encoder-evidence"
          foreach ($id in $ids) {
            Set-Content -LiteralPath (Join-Path $receiverDir "$id.log") -Value "synthetic-ci-receiver-adaptive-evidence"
          }
          .\scripts\phase10g-adaptive.ps1 -Mode ValidateEvidence -ResultsDir $results
          $indexPath = Join-Path $results "evidence-index.json"
          if (-not (Test-Path -LiteralPath $indexPath)) {
            throw "Phase 10G evidence index was not created"
          }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($null -ne $index.qualification_passed) {
            throw "Phase 10G self-test must not claim physical qualification"
          }
          if ($index.production_default_selected -ne $false) {
            throw "Phase 10G self-test must not select production defaults"
          }
          foreach ($field in @("network","topology","recovery","encoder")) {
            if ($null -eq $index.$field -or [string]::IsNullOrWhiteSpace([string]$index.$field.sha256)) {
              throw "Phase 10G self-test did not index optional $field evidence"
            }
          }

      - name: Stage Phase 4 qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase4-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-media-probe.exe phase4-bundle/
          Copy-Item target/release/classmesh-media-receiver.exe phase4-bundle/
          Copy-Item target/release/classmesh-media-recovery-probe.exe phase4-bundle/
          Copy-Item target/release/classmesh-network-impairment-proxy.exe phase4-bundle/
          Copy-Item target/release/classmesh-transport-benchmark.exe phase4-bundle/
          Copy-Item scripts/phase4-two-pc.ps1 phase4-bundle/
          Copy-Item tools/phase4-latency-source.html phase4-bundle/
          Copy-Item docs/PHASE4_TWO_PC_QUALIFICATION.md phase4-bundle/
          Copy-Item docs/PHASE4_TWO_PC_RESULTS.md phase4-bundle/

      - name: Upload Phase 4 qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase4-qualification-windows-x64
          path: phase4-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 6F qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase6f-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-interactive-qualification.exe phase6f-bundle/
          Copy-Item target/release/classmesh-enrollment-request.exe phase6f-bundle/
          Copy-Item target/release/classmesh-enrollment-install.exe phase6f-bundle/
          Copy-Item target/release/classmesh-enrollment-authority.exe phase6f-bundle/
          Copy-Item target/release/classmesh-student-authorize-teacher.exe phase6f-bundle/
          Copy-Item scripts/phase6f-two-pc.ps1 phase6f-bundle/
          Copy-Item docs/PHASE6F_TWO_PC_QUALIFICATION.md phase6f-bundle/
          Copy-Item docs/PHASE6F_TWO_PC_RESULTS.md phase6f-bundle/

      - name: Upload Phase 6F qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase6f-qualification-windows-x64
          path: phase6f-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 7 multicast probe bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase7-multicast-probe-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-multicast-probe.exe phase7-multicast-probe-bundle/
          Copy-Item docs/PHASE7_MULTICAST_PROBE.md phase7-multicast-probe-bundle/
          Copy-Item docs/PHASE7_MULTICAST_PROBE_RESULTS.md phase7-multicast-probe-bundle/

      - name: Upload Phase 7 multicast probe bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase7-multicast-probe-windows-x64
          path: phase7-multicast-probe-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 7H qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase7h-bundle -Force | Out-Null
          Copy-Item scripts/phase7h-scale.ps1 phase7h-bundle/
          Copy-Item docs/PHASE7_SCALE_QUALIFICATION.md phase7h-bundle/
          Copy-Item docs/PHASE7_SCALE_RESULTS.md phase7h-bundle/

      - name: Upload Phase 7H qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase7h-qualification-windows-x64
          path: phase7h-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 8D physical Wi-Fi bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase8d-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-wifi-fanout-benchmark.exe phase8d-bundle/
          Copy-Item scripts/phase8d-wifi.ps1 phase8d-bundle/
          Copy-Item docs/PHASE8_WIFI_FANOUT_BENCHMARK.md phase8d-bundle/
          Copy-Item docs/PHASE8_WIFI_PHYSICAL_QUALIFICATION.md phase8d-bundle/
          Copy-Item docs/PHASE8_WIFI_PHYSICAL_RESULTS.md phase8d-bundle/

      - name: Upload Phase 8D physical Wi-Fi bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase8d-wifi-qualification-windows-x64
          path: phase8d-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 9F monitoring qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase9f-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-monitoring-grid-benchmark.exe phase9f-bundle/
          Copy-Item scripts/phase9f-monitoring.ps1 phase9f-bundle/
          Copy-Item docs/PHASE9_MONITORING_QUALIFICATION.md phase9f-bundle/
          Copy-Item docs/PHASE9_MONITORING_RESULTS.md phase9f-bundle/

      - name: Upload Phase 9F monitoring qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase9f-monitoring-qualification-windows-x64
          path: phase9f-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 10G adaptive qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase10g-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-adaptive-controller-benchmark.exe phase10g-bundle/
          Copy-Item scripts/phase10g-adaptive.ps1 phase10g-bundle/
          Copy-Item docs/PHASE10_ADAPTIVE_QUALIFICATION.md phase10g-bundle/
          Copy-Item docs/PHASE10_ADAPTIVE_RESULTS.md phase10g-bundle/

      - name: Upload Phase 10G adaptive qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase10g-adaptive-qualification-windows-x64
          path: phase10g-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 11F4 Teacher UI bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase11f4-teacher-ui-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-teacher-ui.exe phase11f4-teacher-ui-bundle/
          Copy-Item scripts/phase11f4-teacher-ui-smoke.ps1 phase11f4-teacher-ui-bundle/
          Copy-Item docs/PHASE11_TEACHER_UI_SMOKE.md phase11f4-teacher-ui-bundle/
          Copy-Item docs/PHASE11_TEACHER_UI_SMOKE_RESULTS.md phase11f4-teacher-ui-bundle/
          .\scripts\phase11f4-teacher-ui-smoke.ps1 -Mode IndexBundle -BundleDir phase11f4-teacher-ui-bundle
          .\scripts\phase11f4-teacher-ui-smoke.ps1 -Mode ValidateBundle -BundleDir phase11f4-teacher-ui-bundle

      - name: Upload Phase 11F4 Teacher UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase11f4-teacher-ui-windows-x64
          path: phase11f4-teacher-ui-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Stage Phase 12B4 system-action qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase12b4-system-action-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-service.exe phase12b4-system-action-bundle/
          Copy-Item scripts/phase12b4-system-actions.ps1 phase12b4-system-action-bundle/
          Copy-Item docs/PHASE12_SYSTEM_ACTION_QUALIFICATION.md phase12b4-system-action-bundle/
          Copy-Item docs/PHASE12_SYSTEM_ACTION_RESULTS.md phase12b4-system-action-bundle/
          .\scripts\phase12b4-system-actions.ps1 -Mode IndexBundle -BundleDir phase12b4-system-action-bundle -SourceRevision "${{ github.sha }}"
          .\scripts\phase12b4-system-actions.ps1 -Mode ValidateBundle -BundleDir phase12b4-system-action-bundle
          .\scripts\phase12b4-system-actions.ps1 -Mode CollectPreflight -BundleDir phase12b4-system-action-bundle -EvidenceDir phase12b4-system-action-bundle/ci-evidence -HostedCi
          $evidence = Get-Content -LiteralPath phase12b4-system-action-bundle/ci-evidence/system-action-preflight-evidence.json -Raw | ConvertFrom-Json
          if ($evidence.actions_invoked -ne $false) {
            throw "Phase 12B4a CI must never invoke a system action"
          }
          foreach ($field in @("physical_qualification_passed","lock_execution","restart_execution","shutdown_execution","destructive_target_disposable")) {
            if ($null -ne $evidence.$field) {
              throw "Phase 12B4a CI evidence must leave $field undetermined"
            }
          }

      - name: Upload Phase 12B4 system-action qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase12b4-system-action-qualification-windows-x64
          path: phase12b4-system-action-bundle/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Upload media probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-probe-windows-x64
          path: target/release/classmesh-media-probe.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Upload media receiver
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-receiver-windows-x64
          path: target/release/classmesh-media-receiver.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Upload media recovery probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-recovery-probe-windows-x64
          path: target/release/classmesh-media-recovery-probe.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Upload network impairment proxy
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-network-impairment-proxy-windows-x64
          path: target/release/classmesh-network-impairment-proxy.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}

      - name: Upload transport benchmark
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-transport-benchmark-windows-x64
          path: target/release/classmesh-transport-benchmark.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 60 }}
