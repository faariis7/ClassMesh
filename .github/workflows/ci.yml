name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable Rust
    runs-on: [self-hosted, linux, x64, synology]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Synthetic media lab
        run: cargo run -p classmesh-lab --bin classmesh-lab

  windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Phase 4 PowerShell runner
        shell: pwsh
        run: .\scripts\phase4-two-pc.ps1 -Mode Help

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build media diagnostics
        run: cargo build -p classmesh-worker --bin classmesh-media-probe --bin classmesh-media-receiver --bin classmesh-media-recovery-probe --release

      - name: Build network impairment proxy
        run: cargo build -p classmesh-lab --bin classmesh-network-impairment-proxy --release

      - name: Build transport benchmark
        run: cargo build -p classmesh-lab --bin classmesh-transport-benchmark --release

      - name: Build Phase 7 multicast probe
        run: cargo build -p classmesh-lab --bin classmesh-multicast-probe --release

      - name: Build Phase 6F interactive qualification client
        run: cargo build -p classmesh-lab --bin classmesh-interactive-qualification --release

      - name: Build protected Teacher enrollment request tool
        run: cargo build -p classmesh-lab --bin classmesh-enrollment-request --release

      - name: Build approved Teacher enrollment installer
        run: cargo build -p classmesh-lab --bin classmesh-enrollment-install --release

      - name: Build offline Teacher enrollment authority
        run: cargo build -p classmesh-lab --bin classmesh-enrollment-authority --release

      - name: Build Student Teacher authorization tool
        run: cargo build -p classmesh-lab --bin classmesh-student-authorize-teacher --release

      - name: Validate Phase 6F tool help
        shell: pwsh
        run: |
          .\target\release\classmesh-interactive-qualification.exe --help
          .\target\release\classmesh-enrollment-request.exe --help
          .\target\release\classmesh-enrollment-install.exe --help
          .\target\release\classmesh-enrollment-authority.exe --help
          .\target\release\classmesh-student-authorize-teacher.exe --help

      - name: Validate Phase 6F physical runner help
        shell: pwsh
        run: .\scripts\phase6f-two-pc.ps1 -Mode Help

      - name: Validate Phase 7 multicast probe help
        shell: pwsh
        run: .\target\release\classmesh-multicast-probe.exe --help

      - name: Stage Phase 4 qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase4-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-media-probe.exe phase4-bundle/
          Copy-Item target/release/classmesh-media-receiver.exe phase4-bundle/
          Copy-Item target/release/classmesh-media-recovery-probe.exe phase4-bundle/
          Copy-Item target/release/classmesh-network-impairment-proxy.exe phase4-bundle/
          Copy-Item target/release/classmesh-transport-benchmark.exe phase4-bundle/
          Copy-Item scripts/phase4-two-pc.ps1 phase4-bundle/
          Copy-Item tools/phase4-latency-source.html phase4-bundle/
          Copy-Item docs/PHASE4_TWO_PC_QUALIFICATION.md phase4-bundle/
          Copy-Item docs/PHASE4_TWO_PC_RESULTS.md phase4-bundle/

      - name: Upload Phase 4 qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase4-qualification-windows-x64
          path: phase4-bundle/
          if-no-files-found: error

      - name: Stage Phase 6F qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase6f-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-interactive-qualification.exe phase6f-bundle/
          Copy-Item target/release/classmesh-enrollment-request.exe phase6f-bundle/
          Copy-Item target/release/classmesh-enrollment-install.exe phase6f-bundle/
          Copy-Item target/release/classmesh-enrollment-authority.exe phase6f-bundle/
          Copy-Item target/release/classmesh-student-authorize-teacher.exe phase6f-bundle/
          Copy-Item scripts/phase6f-two-pc.ps1 phase6f-bundle/
          Copy-Item docs/PHASE6F_TWO_PC_QUALIFICATION.md phase6f-bundle/
          Copy-Item docs/PHASE6F_TWO_PC_RESULTS.md phase6f-bundle/

      - name: Upload Phase 6F qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase6f-qualification-windows-x64
          path: phase6f-bundle/
          if-no-files-found: error

      - name: Stage Phase 7 multicast probe bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase7-multicast-probe-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-multicast-probe.exe phase7-multicast-probe-bundle/
          Copy-Item docs/PHASE7_MULTICAST_PROBE.md phase7-multicast-probe-bundle/
          Copy-Item docs/PHASE7_MULTICAST_PROBE_RESULTS.md phase7-multicast-probe-bundle/

      - name: Upload Phase 7 multicast probe bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase7-multicast-probe-windows-x64
          path: phase7-multicast-probe-bundle/
          if-no-files-found: error

      - name: Upload media probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-probe-windows-x64
          path: target/release/classmesh-media-probe.exe
          if-no-files-found: error

      - name: Upload media receiver
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-receiver-windows-x64
          path: target/release/classmesh-media-receiver.exe
          if-no-files-found: error

      - name: Upload media recovery probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-recovery-probe-windows-x64
          path: target/release/classmesh-media-recovery-probe.exe
          if-no-files-found: error

      - name: Upload network impairment proxy
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-network-impairment-proxy-windows-x64
          path: target/release/classmesh-network-impairment-proxy.exe
          if-no-files-found: error

      - name: Upload transport benchmark
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-transport-benchmark-windows-x64
          path: target/release/classmesh-transport-benchmark.exe
          if-no-files-found: error
