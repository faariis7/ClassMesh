name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable Rust
    runs-on: [self-hosted, linux, x64, synology]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Synthetic media lab
        run: cargo run -p classmesh-lab --bin classmesh-lab

  windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Phase 4 PowerShell runner
        shell: pwsh
        run: .\scripts\phase4-two-pc.ps1 -Mode Help

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build media diagnostics
        run: cargo build -p classmesh-worker --bin classmesh-media-probe --bin classmesh-media-receiver --bin classmesh-media-recovery-probe --release

      - name: Build network impairment proxy
        run: cargo build -p classmesh-lab --bin classmesh-network-impairment-proxy --release

      - name: Build transport benchmark
        run: cargo build -p classmesh-lab --bin classmesh-transport-benchmark --release

      - name: Stage Phase 4 qualification bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path phase4-bundle -Force | Out-Null
          Copy-Item target/release/classmesh-media-probe.exe phase4-bundle/
          Copy-Item target/release/classmesh-media-receiver.exe phase4-bundle/
          Copy-Item target/release/classmesh-media-recovery-probe.exe phase4-bundle/
          Copy-Item target/release/classmesh-network-impairment-proxy.exe phase4-bundle/
          Copy-Item target/release/classmesh-transport-benchmark.exe phase4-bundle/
          Copy-Item scripts/phase4-two-pc.ps1 phase4-bundle/
          Copy-Item tools/phase4-latency-source.html phase4-bundle/
          Copy-Item docs/PHASE4_TWO_PC_QUALIFICATION.md phase4-bundle/
          Copy-Item docs/PHASE4_TWO_PC_RESULTS.md phase4-bundle/

      - name: Upload Phase 4 qualification bundle
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-phase4-qualification-windows-x64
          path: phase4-bundle/
          if-no-files-found: error

      - name: Upload media probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-probe-windows-x64
          path: target/release/classmesh-media-probe.exe
          if-no-files-found: error

      - name: Upload media receiver
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-receiver-windows-x64
          path: target/release/classmesh-media-receiver.exe
          if-no-files-found: error

      - name: Upload media recovery probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-recovery-probe-windows-x64
          path: target/release/classmesh-media-recovery-probe.exe
          if-no-files-found: error

      - name: Upload network impairment proxy
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-network-impairment-proxy-windows-x64
          path: target/release/classmesh-network-impairment-proxy.exe
          if-no-files-found: error

      - name: Upload transport benchmark
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-transport-benchmark-windows-x64
          path: target/release/classmesh-transport-benchmark.exe
          if-no-files-found: error
