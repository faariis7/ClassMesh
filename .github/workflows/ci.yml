name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Synthetic media lab
        run: cargo run -p classmesh-lab --bin classmesh-lab

  windows:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build media diagnostics
        run: cargo build -p classmesh-worker --bin classmesh-media-probe --bin classmesh-media-receiver --bin classmesh-media-recovery-probe --release

      - name: Build network impairment proxy
        run: cargo build -p classmesh-lab --bin classmesh-network-impairment-proxy --release

      - name: Upload media probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-probe-windows-x64
          path: target/release/classmesh-media-probe.exe
          if-no-files-found: error

      - name: Upload media receiver
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-receiver-windows-x64
          path: target/release/classmesh-media-receiver.exe
          if-no-files-found: error

      - name: Upload media recovery probe
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-media-recovery-probe-windows-x64
          path: target/release/classmesh-media-recovery-probe.exe
          if-no-files-found: error

      - name: Upload network impairment proxy
        uses: actions/upload-artifact@v4
        with:
          name: classmesh-network-impairment-proxy-windows-x64
          path: target/release/classmesh-network-impairment-proxy.exe
          if-no-files-found: error
